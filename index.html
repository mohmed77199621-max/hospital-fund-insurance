/* --- تعديل تاريخ صف واحد يدويًا --- */
function updateRowDate(session, idx, value){
  const m = getCurrentMonth(); if(!m || m.locked) return;
  const rows = session==='evening' ? m.receiptLogEvening : m.receiptLogMorning;
  if(rows[idx]) rows[idx].date = value;
  scheduleAutoSave();
  updateLogWrap(session);
}

/* --- سحب خانة التاريخ (مثل مقبض التعبئة فى الإكسل) لتطبيق نفس التاريخ على عدة صفوف تحتها --- */
function startDateDragFill(session, idx, value, evt){
  evt.preventDefault();
  dragFillState = { session, idx, value, targetIdx: idx };
  document.body.classList.add('date-dragging');
  document.addEventListener('mousemove', onDateDragMove);
  document.addEventListener('mouseup', onDateDragEnd);
}
function onDateDragMove(e){
  if(!dragFillState) return;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const rowEl = el && el.closest ? el.closest('tr[data-row-idx]') : null;
  document.querySelectorAll('tr.date-fill-target').forEach(tr=>tr.classList.remove('date-fill-target'));
  if(rowEl){
    const targetIdx = Number(rowEl.dataset.rowIdx);
    dragFillState.targetIdx = targetIdx;
    const lo = Math.min(dragFillState.idx, targetIdx), hi = Math.max(dragFillState.idx, targetIdx);
    document.querySelectorAll('tr[data-row-idx]').forEach(tr=>{
      const ri = Number(tr.dataset.rowIdx);
      if(ri>=lo && ri<=hi && ri!==dragFillState.idx) tr.classList.add('date-fill-target');
    });
  }
}
function onDateDragEnd(){
  document.removeEventListener('mousemove', onDateDragMove);
  document.removeEventListener('mouseup', onDateDragEnd);
  document.body.classList.remove('date-dragging');
  document.querySelectorAll('tr.date-fill-target').forEach(tr=>tr.classList.remove('date-fill-target'));
  if(dragFillState && dragFillState.targetIdx!==undefined && dragFillState.targetIdx!==dragFillState.idx){
    const m = getCurrentMonth();
    if(m && !m.locked){
      const rows = dragFillState.session==='evening' ? m.receiptLogEvening : m.receiptLogMorning;
      const lo = Math.min(dragFillState.idx, dragFillState.targetIdx);
      const hi = Math.max(dragFillState.idx, dragFillState.targetIdx);
      for(let i=lo;i<=hi;i++){ if(rows[i]) rows[i].date = dragFillState.value; }
      scheduleAutoSave();
      updateLogWrap(dragFillState.session);
    }
  }
  dragFillState = null;
}

/* --- تعديل ملاحظة صف واحد (عمود مستقل لكل صف — لا علاقة له بباقى الصفوف) --- */
function updateRowNote(session, idx, value){
  const m = getCurrentMonth(); if(!m || m.locked) return;
  const rows = session==='evening' ? m.receiptLogEvening : m.receiptLogMorning;
  if(rows[idx]) rows[idx].notes = value;
  scheduleAutoSave();
}

/* --- تعديل إجمالى اليومية اليدوى — قيمة مستقلة لكل صف على حدة: الرقم يبقى فقط فى الخانة التى كُتب بها --- */
function updateRowDaily(session, idx, val){
  const m = getCurrentMonth(); if(!m || m.locked) return;
  const rows = session==='evening' ? m.receiptLogEvening : m.receiptLogMorning;
  if(!rows[idx]) return;
  const v = String(val).trim();
  rows[idx].daily = (v==='') ? '' : (parseFloat(v)||0);
  scheduleAutoSave();
}

/* --- جدول السجل الواسع بنفس تنسيق ملفات الإكسل: صفوف إجمالى/عدد إيصالات أعلى الرأس + فلتر لكل عمود
   ترتيب الأعمدة: التاريخ | رقم الإيصال | المجموعة | الدفتر | [الخدمات...] | إجمالى الدفتر | إجمالى اليومية (لكل صف) | ملاحظات (أخيرًا)
   + سحب التاريخ + عرض كل الصفوف دائمًا --- */
function wideLogTableHtml(rows, editableSession, m, session){
  rows = rows || [];
  const showDelete = !!editableSession;
  const extras = computeRowExtras(rows);
  const filtered = getFilteredRows(rows, session);
  const hasActiveFilter = logFilters[session] && Object.keys(logFilters[session]).length>0;

  const fixedHeaders = ['التاريخ','رقم الإيصال','المجموعة','الدفتر'];
  const allHeaders = [...fixedHeaders, ...SERVICE_NAMES, 'إجمالى الدفتر','إجمالى اليومية (لكل صف)','ملاحظات'];
  const bookletColIdx = fixedHeaders.length + SERVICE_NAMES.length;
  const dailyColIdx = bookletColIdx + 1;
  const notesColIdx = bookletColIdx + 2;
  const colBandClass = idx => {
    // ألوان أعمدة دورية على شكل مجموعات، بنفس روح شيت الإكسل الملوّن
    const palette = ['band-1','band-2','band-3','band-4'];
    if(idx < fixedHeaders.length) return 'band-fixed';
    if(idx >= bookletColIdx) return 'band-fixed';
    return palette[Math.floor((idx-fixedHeaders.length)/3) % palette.length];
  };

  // صف الألوان الزخرفى العلوى
  const bandRowHtml = allHeaders.map((h,idx)=>`<td class="excel-band ${colBandClass(idx)}"></td>`).join('') + (showDelete?'<td class="no-print"></td>':'');

  // صف عدد الإيصالات (لكل بند: عدد الصفوف المرئية/المفلترة التى بها قيمة أكبر من صفر)
  const countCells = allHeaders.map((h,idx)=>{
    if(idx < fixedHeaders.length) return `<td class="excel-count">${idx===0?'عدد الإيصالات':''}</td>`;
    if(idx >= bookletColIdx) return `<td class="excel-count">—</td>`;
    const svcIdx = idx - fixedHeaders.length;
    const count = filtered.filter(({r})=>(Number(r.svc[svcIdx])||0)>0).length;
    return `<td class="excel-count num">${count||''}</td>`;
  }).join('') + (showDelete?'<td class="no-print"></td>':'');

  // صف إجمالى التوريد (لكل بند: مجموع الصفوف المرئية/المفلترة)
  const totalCells = allHeaders.map((h,idx)=>{
    if(idx < fixedHeaders.length) return `<td class="excel-supply-total">${idx===0?'اجمالى التوريد':''}</td>`;
    if(idx >= bookletColIdx) return `<td class="excel-supply-total">—</td>`;
    const svcIdx = idx - fixedHeaders.length;
    const total = filtered.reduce((s,{r})=> s + (Number(r.svc[svcIdx])||0), 0);
    return `<td class="excel-supply-total num">${total?fmtNum(total):''}</td>`;
  }).join('') + (showDelete?'<td class="no-print"></td>':'');

  // صف رؤوس الأعمدة مع أيقونة فلتر (▼) لكل عمود بيانات فعلى، مثل الإكسل (ما عدا "إجمالى الدفتر" المحسوب)
  colfCurrentRows = rows;
  const headerRowHtml = allHeaders.map((h,idx)=>{
    if(idx===bookletColIdx) return `<th>${escapeHtml(h)}</th>`;
    const isFiltered = logFilters[session] && logFilters[session][idx] instanceof Set;
    const filterIcon = `<span class="col-filter-ic no-print ${isFiltered?'active':''}" onclick="toggleColumnFilterMenu('${session}',${idx},event)" title="فلتر">▾</span>`;
    return `<th>${escapeHtml(h)} ${filterIcon}</th>`;
  }).join('') + (showDelete?'<th class="no-print" style="width:34px"></th>':'');

  let bodyHtml = '';
  for(let i=0;i<filtered.length;i++){
    const { r, i: origIdx } = filtered[i];
    const ex = extras[origIdx];

    const dateCell = editableSession
      ? `<td style="position:relative"><input type="text" class="cell-input date-input" style="border:1px solid var(--b);text-align:center;padding-left:14px" value="${escapeHtml(r.date)}" onchange="updateRowDate('${session}',${origIdx},this.value)"><span class="fill-handle" title="اسحب لتطبيق نفس التاريخ على صفوف أخرى" onmousedown="startDateDragFill('${session}',${origIdx},this.previousElementSibling.value,event)"></span></td>`
      : `<td>${escapeHtml(r.date)}</td>`;
    const midFixedCells = [r.receiptNo, r.group, r.booklet].map(v=>`<td>${escapeHtml(v)}</td>`).join('');

    let svcCells = '';
    for(let ci=0; ci<SERVICE_NAMES.length; ci++){
      const v = Number(r.svc[ci])||0;
      svcCells += `<td class="num">${v?fmtNum(v):''}</td>`;
    }
    const bookletCell = `<td class="num" style="font-weight:900;color:var(--a)">${ex.bookletTotal!==null?fmt(ex.bookletTotal):''}</td>`;

    const hasDaily = r.daily!==undefined && r.daily!==null && r.daily!=='';
    let dayCell;
    if(editableSession){
      dayCell = `<td><input type="number" step="0.01" class="cell-input" style="font-weight:900;color:var(--p);text-align:center" value="${hasDaily?r.daily:''}" placeholder="—" onchange="updateRowDaily('${session}',${origIdx},this.value)"></td>`;
    } else {
      dayCell = `<td class="num" style="font-weight:900;color:var(--p)">${hasDaily?fmt(r.daily):''}</td>`;
    }
    const notesCell = editableSession
      ? `<td><input type="text" class="cell-input" style="border:1px solid var(--b);min-width:130px" value="${escapeHtml(r.notes||'')}" placeholder="ملاحظة..." onchange="updateRowNote('${session}',${origIdx},this.value)"></td>`
      : `<td style="white-space:normal;min-width:110px">${escapeHtml(r.notes||'')}</td>`;
    const delCell = showDelete ? `<td class="no-print"><button class="btn-er" onclick="removeWideLogRow('${editableSession}',${origIdx})">✕</button></td>` : '';
    bodyHtml += `<tr data-row-idx="${origIdx}">${dateCell}${midFixedCells}${svcCells}${bookletCell}${dayCell}${notesCell}${delCell}</tr>`;
  }
  if(!bodyHtml){
    bodyHtml = `<tr><td colspan="${allHeaders.length+(showDelete?1:0)}" style="color:var(--tm);font-weight:600">${hasActiveFilter?'لا توجد صفوف مطابقة للفلتر الحالى':'لا توجد قيود بعد'}</td></tr>`;
  }

  let svcTotals = '';
  for(let ci=0; ci<SERVICE_NAMES.length; ci++){
    const t = filtered.reduce((s,{r})=> s + (Number(r.svc[ci])||0), 0);
    svcTotals += `<td class="num" style="font-weight:900">${t?fmtNum(t):'0'}</td>`;
  }
  const totalsHtml = `<td colspan="4">الإجمالى (${filtered.length} إيصال${hasActiveFilter?' — بعد الفلتر من '+rows.length:''})</td>` + svcTotals +
    `<td class="num">—</td><td class="num">—</td><td class="num">—</td>` +
    (showDelete?'<td class="no-print"></td>':'');

  const filterBar = hasActiveFilter ? `<div class="load-more-bar no-print" style="background:#fbeedd;border-color:#eccf9c">
      <span>⚠ يوجد فلتر مُفعّل على عمود واحد أو أكثر — الأرقام أعلى الجدول والإجمالى محسوبة على الصفوف الظاهرة فقط</span>
      <button class="btn btn-o btn-sm" onclick="clearAllColumnFilters('${session}')">✕ مسح كل الفلاتر</button>
    </div>` : '';

  return `${filterBar}<div style="overflow-x:auto"><table class="tbl wide-log-tbl excel-style">
    <thead>
      <tr class="excel-band-row">${bandRowHtml}</tr>
      <tr class="excel-summary-row">${countCells}</tr>
      <tr class="excel-summary-row">${totalCells}</tr>
      <tr>${headerRowHtml}</tr>
    </thead>
    <tbody>${bodyHtml}</tbody>
    <tfoot><tr>${totalsHtml}</tr></tfoot>
  </table></div>`;
}

function updateLogWrap(session){
  const m = getCurrentMonth(); if(!m) return;
  const rows = session==='morning' ? m.receiptLogMorning : m.receiptLogEvening;
  const wrap = document.getElementById('log-'+session+'-wrap');
  if(wrap) wrap.innerHTML = wideLogTableHtml(rows, m.locked?null:session, m, session);
}

/* --- تصدير سجل فترة واحدة (صباحى أو مسائى) إلى ملف إكسل مستقل --- */
function exportLogToExcel(session){
  const m = getCurrentMonth(); if(!m) return;
  const rows = session==='evening' ? m.receiptLogEvening : m.receiptLogMorning;
  if(!rows.length){ alert('لا توجد بيانات فى هذا السجل لتصديرها.'); return; }
  const extras = computeRowExtras(rows);
  const header = ['التاريخ','رقم الإيصال','المجموعة','الدفتر', ...SERVICE_NAMES, 'إجمالى الدفتر','إجمالى اليومية','ملاحظات'];
  const aoa = [header];
  rows.forEach((r,i)=>{
    const ex = extras[i];
    const svcVals = SERVICE_NAMES.map((n,ci)=> Number(r.svc[ci])||0);
    const dayVal = (r.daily!==undefined && r.daily!==null && r.daily!=='') ? r.daily : '';
    aoa.push([r.date||'', r.receiptNo||'', r.group||'', r.booklet||'', ...svcVals, ex.bookletTotal!==null?ex.bookletTotal:'', dayVal, r.notes||'']);
  });
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const wb = XLSX.utils.book_new();
  const sheetName = session==='evening' ? 'سجل المسائية' : 'سجل الصباحية';
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  const safeLabel = String(m.label||'').replace(/[\\/:*?"<>|]/g,'-');
  XLSX.writeFile(wb, `سجل ${session==='evening'?'المسائية':'الصباحية'} - ${safeLabel}.xlsx`);
}

/* --- ملخص التوريد والإيصالات (يتحدث تلقائيًا) --- */
function computeReceiptSummary(m){
  let totalMorning = 0, totalEvening = 0;
  m.receiptLogMorning.forEach(r=>{ for(let ci=0; ci<SERVICE_NAMES.length; ci++) totalMorning += (Number(r.svc[ci])||0); });
  m.receiptLogEvening.forEach(r=>{ for(let ci=0; ci<SERVICE_NAMES.length; ci++) totalEvening += (Number(r.svc[ci])||0); });
  return {
    totalBoth: totalMorning+totalEvening,
    totalMorning, totalEvening,
    countMorning: m.receiptLogMorning.length,
    countEvening: m.receiptLogEvening.length
  };
}
function receiptSummaryHtml(s){
  return `
    <div class="rs-card"><div class="rs-lbl">إجمالى التوريد (صباحى + مسائى)</div><div class="rs-val" id="rs-total-both">${fmt(s.totalBoth)}</div></div>
    <div class="rs-card"><div class="rs-lbl">إجمالى التوريد الصباحى</div><div class="rs-val" id="rs-total-morning">${fmt(s.totalMorning)}</div></div>
    <div class="rs-card"><div class="rs-lbl">إجمالى التوريد المسائى</div><div class="rs-val" id="rs-total-evening">${fmt(s.totalEvening)}</div></div>
    <div class="rs-card"><div class="rs-lbl">إجمالى الإيصالات الصباحى</div><div class="rs-val" id="rs-count-morning">${fmtNum(s.countMorning)}</div></div>
    <div class="rs-card"><div class="rs-lbl">إجمالى الإيصالات المسائى</div><div class="rs-val" id="rs-count-evening">${fmtNum(s.countEvening)}</div></div>`;
}
function updateReceiptSummaryPanel(){
  const m = getCurrentMonth(); if(!m) return;
  const s = computeReceiptSummary(m);
  const grid = document.getElementById('receipt-summary-grid');
  if(grid){ grid.innerHTML = receiptSummaryHtml(s); return; }
}

/* --- نافذة إدخال المبلغ: ضغطة تفتح الشاشة المميزة، وضغطة ثانية (أو نقر مزدوج) تحفظ --- */
function onServiceClick(idx){
  const m = getCurrentMonth(); if(!m) return;
  const status = bookletStatus(m, sessionKey());
  if(!status.ok){
    alert(status.reason==='finished' ? 'انتهى هذا الدفتر. من فضلك عرّف دفترًا جديدًا قبل المتابعة.' : 'لم يتم تعريف دفتر لهذه الفترة بعد. من فضلك اضغط "📖 تعريف دفتر جديد" أولاً.');
    return;
  }
  if(activeModalServiceIdx === idx){
    confirmSaveFromModal();
    return;
  }
  openEntryModal(idx);
}
function onServiceDblClick(idx){
  const m = getCurrentMonth(); if(!m) return;
  const status = bookletStatus(m, sessionKey());
  if(!status.ok) return;
  if(activeModalServiceIdx !== idx) openEntryModal(idx);
  confirmSaveFromModal();
}
function openEntryModal(idx){
  activeModalServiceIdx = idx;
  const name = SERVICE_NAMES[idx];
  document.querySelectorAll('.service-btn').forEach(b=>b.classList.remove('active'));
  const btn = document.querySelector(`.service-btn[data-svc-idx="${idx}"]`);
  if(btn) btn.classList.add('active');
  setText('modal-service-name', name);
  const modal = document.getElementById('entry-modal');
  const amountInput = document.getElementById('modal-amount');
  const price = SERVICE_PRICES[name];
  amountInput.value = (price!==undefined && price!==null && price!=='') ? price : '';
  modal.style.display = 'flex';
  setTimeout(()=>{ amountInput.focus(); amountInput.select(); }, 30);
}
function closeEntryModal(){
  activeModalServiceIdx = null;
  document.querySelectorAll('.service-btn').forEach(b=>b.classList.remove('active'));
  const modal = document.getElementById('entry-modal');
  if(modal) modal.style.display = 'none';
}
function confirmSaveFromModal(){
  const m = getCurrentMonth(); if(!m || m.locked) return;
  if(activeModalServiceIdx===null) return;

  const amountVal = parseFloat(document.getElementById('modal-amount').value);
  if(!amountVal || amountVal<=0){
    alert('من فضلك أدخل مبلغًا أكبر من صفر — لا يمكن حفظ قيد بمبلغ صفر.');
    return;
  }

  const sk = sessionKey();
  const status = bookletStatus(m, sk);
  if(!status.ok){
    alert(status.reason==='finished' ? 'انتهى هذا الدفتر. من فضلك عرّف دفترًا جديدًا قبل المتابعة.' : 'لم يتم تعريف دفتر لهذه الفترة بعد. من فضلك عرّف دفترًا جديدًا أولاً.');
    closeEntryModal();
    return;
  }

  const dateVal = document.getElementById('re-date').value || todayIso();
  const receiptNoVal = document.getElementById('re-receiptno').value.trim();
  const groupVal = document.getElementById('re-group').value.trim();
  if(!receiptNoVal){ alert('من فضلك أدخل رقم الإيصال.'); return; }

  const bk = m.booklet[sk];
  const bookletLabel = `${bk.start}-${bk.end}`;
  const row = { date: dateVal, receiptNo: receiptNoVal, group: groupVal, booklet: bookletLabel, svc: Array(SERVICE_NAMES.length).fill(0), daily: '', notes: '' };
  row.svc[activeModalServiceIdx] = amountVal;

  if(sk==='evening'){ m.receiptLogEvening.push(row); } else { m.receiptLogMorning.push(row); }

  bk.current = incrementReceiptNo(receiptNoVal);
  m.lastGroup = groupVal;

  closeEntryModal();
  refreshEntryAvailability();
  updateLogWrap(sk);
  updateReceiptSummaryPanel();
  syncSupplyFromReceipts();
  scheduleAutoSave();
}

function removeWideLogRow(which, idx){
  const m = getCurrentMonth(); if(!m || m.locked) return;
  const arr = which==='morning' ? m.receiptLogMorning : m.receiptLogEvening;
  arr.splice(idx,1);
  updateLogWrap(which);
  updateReceiptSummaryPanel();
  syncSupplyFromReceipts();
  scheduleAutoSave();
}

/* --- شاشة إدارة الخدمات والأسعار (شاشة مستقلة احترافية، مشتركة بين كل الشهور والأجهزة) --- */
function toastSaved(msg){
  const toast = document.getElementById('save-toast');
  if(!toast) return;
  toast.textContent = msg || '✔ تم الحفظ';
  toast.classList.remove('err'); toast.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>toast.classList.remove('show'), 2200);
}

function renderServicesManagerSheet(){
  const activeRows = SERVICE_NAMES.map((name,idx)=>{
    if(HIDDEN_SERVICES.includes(name)) return '';
    const price = SERVICE_PRICES[name];
    const martyr = SERVICE_MARTYR_PRICES[name];
    return `<tr>
      <td><input class="cell-input name-input" style="border:1px solid var(--b)" value="${escapeHtml(name)}" onchange="renameServiceAction(${idx}, this.value)"></td>
      <td><input type="number" step="0.01" class="cell-input" style="border:1px solid var(--b);text-align:center" value="${price!==undefined?price:''}" placeholder="0.00" onchange="setServicePriceAction(${idx}, this.value)"></td>
      <td><input type="number" step="0.01" class="cell-input" style="border:1px solid var(--b);text-align:center" value="${martyr!==undefined?martyr:5}" onchange="setServiceMartyrAction(${idx}, this.value)"></td>
      <td class="no-print" style="text-align:center"><button class="btn-er" onclick="deleteServiceAction(${idx})">🙈 إخفاء</button></td>
    </tr>`;
  }).join('') || '';
  const rowsHtml = activeRows || `<tr><td colspan="4" style="color:var(--tm);font-weight:600">لا توجد خدمات نشطة — اضغط "➕ إضافة خدمة جديدة"</td></tr>`;

  const hiddenNames = SERVICE_NAMES.filter(n=>HIDDEN_SERVICES.includes(n));
  const hiddenSection = hiddenNames.length ? `
  <div class="sheet-card">
    <h2>🙈 الخدمات المخفية (${hiddenNames.length})</h2>
    <div style="font-size:.72rem;font-weight:700;color:var(--tm);margin-bottom:12px">
      هذه الخدمات لا تظهر فى شاشة إدخال التوريد ولا فى القائمة النشطة أعلاه، لكن أعمدتها وبياناتها التاريخية باقية بالكامل فى السجل ولم تُحذف. اضغط "↩ إظهار" لإعادتها للاستخدام.
    </div>
    <div style="overflow-x:auto">
    <table class="tbl">
      <thead><tr><th style="min-width:220px">اسم الخدمة</th><th class="no-print" style="width:100px"></th></tr></thead>
      <tbody>${hiddenNames.map(name=>{
        const idx = SERVICE_NAMES.indexOf(name);
        return `<tr><td>${escapeHtml(name)}</td><td class="no-print" style="text-align:center"><button class="btn btn-o btn-sm" onclick="restoreServiceAction(${idx})">↩ إظهار</button></td></tr>`;
      }).join('')}</tbody>
    </table>
    </div>
  </div>` : '';

  return `
  <div class="sheet-card">
    <div class="sheet-card-head">
      <h2>⚙ قائمة الخدمات والأسعار الافتراضية</h2>
      <div class="head-btns no-print">
        <button class="btn btn-p btn-sm" onclick="openAddServiceModal()">➕ إضافة خدمة جديدة</button>
      </div>
    </div>
    <div style="font-size:.72rem;font-weight:700;color:var(--tm);margin-bottom:14px;line-height:1.7">
      هذه القائمة مشتركة بين كل الشهور وكل الأجهزة. أى خدمة تُضاف هنا تظهر تلقائيًا كبند فى شاشتى إدخال التوريد (الصباحية والمسائية) وكعمود جديد فى السجل، وسعر فئة "شهداء" الخاص بها يبدأ افتراضيًا بقيمة 5 ويمكن تعديله.
      <br>⚠ "إخفاء" خدمة يمنعها من الظهور فى شاشة الإدخال فقط — عمودها وكل بياناتها التاريخية فى السجل تبقى محفوظة كما هى ولا تُحذف نهائيًا.
    </div>
    <div style="overflow-x:auto">
    <table class="tbl">
      <thead><tr><th style="min-width:220px">اسم الخدمة</th><th style="width:170px">السعر الافتراضى (ج.م)</th><th style="width:150px">سعر شهداء (ج.م)</th><th class="no-print" style="width:100px"></th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
    </div>
  </div>
  ${hiddenSection}

  <div class="entry-modal-backdrop no-print" id="add-service-modal" style="display:none" onclick="if(event.target===this)closeAddServiceModal()">
    <div class="entry-modal-box" style="text-align:right">
      <div class="entry-modal-title">➕ إضافة خدمة جديدة</div>
      <label style="display:block;font-size:.72rem;font-weight:800;color:var(--tm);margin-bottom:6px">اسم الخدمة</label>
      <input type="text" id="new-svc-name" class="cell-input" style="border:1px solid var(--b);margin-bottom:14px" placeholder="مثال: أشعة رنين مفصل">
      <label style="display:block;font-size:.72rem;font-weight:800;color:var(--tm);margin-bottom:6px">السعر الافتراضى (ج.م) — اختيارى</label>
      <input type="number" step="0.01" id="new-svc-price" class="cell-input" style="border:1px solid var(--b);margin-bottom:14px;text-align:center" placeholder="0.00">
      <label style="display:block;font-size:.72rem;font-weight:800;color:var(--tm);margin-bottom:6px">سعر فئة شهداء (ج.م)</label>

        <button class="btn btn-o" onclick="closeAddServiceModal()">إلغاء</button>

function openAddServiceModal(){
  const modal = document.getElementById('add-service-modal');
  if(!modal) return;
  document.getElementById('new-svc-name').value = '';
  document.getElementById('new-svc-price').value = '';
  document.getElementById('new-svc-martyr').value = '5';
  modal.style.display = 'flex';
  setTimeout(()=>{ document.getElementById('new-svc-name').focus(); }, 30);
}
function closeAddServiceModal(){
  const modal = document.getElementById('add-service-modal');
  if(modal) modal.style.display = 'none';
}
async function confirmAddService(){
  const name = document.getElementById('new-svc-name').value.trim();
  const price = parseFloat(document.getElementById('new-svc-price').value);
  const martyr = parseFloat(document.getElementById('new-svc-martyr').value);
  if(!name){ alert('من فضلك أدخل اسم الخدمة.'); return; }
  if(SERVICE_NAMES.includes(name)){ alert('هذه الخدمة موجودة بالفعل فى القائمة.'); return; }
  SERVICE_NAMES.push(name);
  if(!isNaN(price) && price>0) SERVICE_PRICES[name] = price;
  SERVICE_MARTYR_PRICES[name] = !isNaN(martyr) ? martyr : 5; // القيمة الافتراضية 5 فى نفس صف الخدمة مباشرة
  await storageSet(SERVICES_KEY, JSON.stringify(SERVICE_NAMES));
  await storageSet(SERVICE_PRICES_KEY, JSON.stringify(SERVICE_PRICES));
  await storageSet(SERVICE_MARTYR_KEY, JSON.stringify(SERVICE_MARTYR_PRICES));
  closeAddServiceModal();
  renderSheet();
  toastSaved('✔ تمت إضافة الخدمة');
}
async function renameServiceAction(idx, newNameRaw){
  const newName = String(newNameRaw||'').trim();
  const oldName = SERVICE_NAMES[idx];
  if(!newName || newName===oldName){ renderSheet(); return; }
  if(SERVICE_NAMES.includes(newName)){ alert('يوجد بالفعل خدمة بنفس هذا الاسم.'); renderSheet(); return; }
  if(SERVICE_PRICES[oldName]!==undefined){ SERVICE_PRICES[newName] = SERVICE_PRICES[oldName]; delete SERVICE_PRICES[oldName]; }
  if(SERVICE_MARTYR_PRICES[oldName]!==undefined){ SERVICE_MARTYR_PRICES[newName] = SERVICE_MARTYR_PRICES[oldName]; delete SERVICE_MARTYR_PRICES[oldName]; }
  if(HIDDEN_SERVICES.includes(oldName)){ HIDDEN_SERVICES[HIDDEN_SERVICES.indexOf(oldName)] = newName; }
  SERVICE_NAMES[idx] = newName;
  await storageSet(SERVICES_KEY, JSON.stringify(SERVICE_NAMES));
  await storageSet(SERVICE_PRICES_KEY, JSON.stringify(SERVICE_PRICES));
  await storageSet(SERVICE_MARTYR_KEY, JSON.stringify(SERVICE_MARTYR_PRICES));
  await storageSet(HIDDEN_SERVICES_KEY, JSON.stringify(HIDDEN_SERVICES));
  renderSheet();
  toastSaved('✔ تم تعديل اسم الخدمة');
}
async function setServicePriceAction(idx, val){
  const name = SERVICE_NAMES[idx];
  const v = parseFloat(val);
  if(!isNaN(v) && v>0) SERVICE_PRICES[name] = v; else delete SERVICE_PRICES[name];
  await storageSet(SERVICE_PRICES_KEY, JSON.stringify(SERVICE_PRICES));
  toastSaved('✔ تم حفظ السعر');
}
async function setServiceMartyrAction(idx, val){
  const name = SERVICE_NAMES[idx];
  const v = parseFloat(val);
  SERVICE_MARTYR_PRICES[name] = !isNaN(v) ? v : 5;
  await storageSet(SERVICE_MARTYR_KEY, JSON.stringify(SERVICE_MARTYR_PRICES));
  toastSaved('✔ تم حفظ سعر الشهداء');
}
/* --- "حذف" خدمة = إخفاؤها فقط عن شاشة الإدخال؛ عمودها وكل بياناتها التاريخية فى السجل تبقى كما هى --- */
async function deleteServiceAction(idx){
  const name = SERVICE_NAMES[idx];
  if(!confirm(`سيتم إخفاء الخدمة "${name}" من شاشة إدخال التوريد وقائمة الخدمات النشطة فقط.\nعمودها وكل القيود المُدخلة لها سابقًا فى السجل ستبقى محفوظة دون أى حذف، ويمكنك إظهارها مرة أخرى فى أى وقت.\n\nهل تريد المتابعة؟`)) return;
  if(!HIDDEN_SERVICES.includes(name)) HIDDEN_SERVICES.push(name);
  await storageSet(HIDDEN_SERVICES_KEY, JSON.stringify(HIDDEN_SERVICES));
  renderSheet();
  toastSaved('✔ تم إخفاء الخدمة (بياناتها محفوظة)');
}
async function restoreServiceAction(idx){
  const name = SERVICE_NAMES[idx];
  const pos = HIDDEN_SERVICES.indexOf(name);
  if(pos>-1) HIDDEN_SERVICES.splice(pos,1);
  await storageSet(HIDDEN_SERVICES_KEY, JSON.stringify(HIDDEN_SERVICES));
  renderSheet();
  toastSaved('✔ تم إظهار الخدمة مرة أخرى');
}

/* --- صفحة "إيرادات الخزنة" — صفحة ثابتة مستقلة عن الشهور، بنفس شكل شيت "يناير توريد خزنة رئيسية" فى الإكسل الأصلى --- */
const TREASURY_COLS = [
  { key:'m', label:'م', type:'text', width:'55px' },
  { key:'period', label:'الفترة', type:'text', width:'90px' },
  { key:'from', label:'من', type:'date', width:'130px' },
  { key:'to', label:'الى', type:'date', width:'130px' },
  { key:'group', label:'مجموعة', type:'text', width:'90px' },
  { key:'receiptNo', label:'رقم الإيصال 37ع.ح', type:'text', width:'110px' },
  { key:'clinics', label:'عيادات', type:'num' },
  { key:'visit', label:'زيارة عادية', type:'num' },
  { key:'econ', label:'اقتصادى عادى', type:'num' },
  { key:'deficit', label:'عجز توريد', type:'num' },
  { key:'martyrs', label:'صندوق شهداء', type:'num' },
  { key:'companion', label:'مرافق مريض', type:'num' },
  { key:'decisions', label:'قرارات', type:'num' },
  { key:'bankRef', label:'رقم توريد البنك', type:'text', width:'110px' },
  { key:'bankDate', label:'تاريخ التوريد', type:'date', width:'130px' },
  { key:'notes', label:'ملاحظات', type:'text', width:'140px' }
];
const TREASURY_SUM_KEYS = ['clinics','visit','econ','deficit','martyrs','companion','decisions'];

function treasuryRowTotal(r){
  return TREASURY_SUM_KEYS.reduce((s,k)=> s + (Number(r[k])||0), 0);
}

function renderTreasurySheet(){
  const rows = TREASURY_ROWS;
  const grandTotal = rows.reduce((s,r)=> s + treasuryRowTotal(r), 0);
  const sums = {};
  TREASURY_SUM_KEYS.forEach(k=> sums[k] = rows.reduce((s,r)=> s + (Number(r[k])||0), 0));

  const headHtml = TREASURY_COLS.map(c=>`<th${c.width?` style="min-width:${c.width}"`:''}>${escapeHtml(c.label)}</th>`).join('') + '<th>الإجمالى</th><th class="no-print" style="width:34px"></th>';

  const bodyHtml = rows.map((r,i)=>{
    const cells = TREASURY_COLS.map(c=>{
      const v = r[c.key]===undefined||r[c.key]===null ? '' : r[c.key];
      if(c.type==='text'){
        return `<td><input class="cell-input name-input" style="border:1px solid var(--b)" value="${escapeHtml(v)}" onchange="updateTreasuryCell(${i},'${c.key}',this.value)"></td>`;
      }
      if(c.type==='date'){
        return `<td><input type="text" class="cell-input" style="border:1px solid var(--b);text-align:center" placeholder="YYYY-MM-DD" value="${escapeHtml(v)}" onchange="updateTreasuryCell(${i},'${c.key}',this.value)"></td>`;
      }
      return `<td><input type="number" step="0.01" class="cell-input" style="border:1px solid var(--b);text-align:center" value="${v!==''?v:''}" onchange="updateTreasuryCell(${i},'${c.key}',this.value)"></td>`;
    }).join('');
    const total = treasuryRowTotal(r);
    return `<tr>${cells}<td class="num" style="font-weight:900;color:var(--a)">${total?fmtNum(total):'0'}</td><td class="no-print"><button class="btn-er" onclick="deleteTreasuryRow(${i})">✕</button></td></tr>`;
  }).join('') || `<tr><td colspan="${TREASURY_COLS.length+2}" style="color:var(--tm);font-weight:600">لا توجد بيانات بعد</td></tr>`;

  const totalsRow = TREASURY_COLS.map(c=>{
    if(c.key==='m') return `<td>الإجمالى (${rows.length} إيصال)</td>`;
    if(TREASURY_SUM_KEYS.includes(c.key)) return `<td class="num" style="font-weight:900">${fmtNum(sums[c.key])}</td>`;
    return `<td>—</td>`;
  }).join('') + `<td class="num" style="font-weight:900;color:var(--a)">${fmtNum(grandTotal)}</td><td class="no-print"></td>`;

  return `
  <div class="sheet-card">
    <div class="sheet-card-head">
      <h2>🏦 الخزنة الرئيسية — إيصال 37 (الخزنة وتوريد البنك)</h2>
      <div class="head-btns no-print">
        <button class="btn btn-p btn-sm" onclick="addTreasuryRow()">➕ إضافة صف جديد</button>
        <button class="btn btn-ok btn-sm" onclick="exportTreasuryToExcel()">⬇ تصدير إكسل</button>
      </div>
    </div>
    <div style="font-size:.72rem;font-weight:700;color:var(--tm);margin-bottom:14px;line-height:1.7">
      هذه الصفحة ثابتة ومستقلة عن قائمة الشهور — بنفس أعمدة شيت "يناير توريد خزنة رئيسية" فى ملف الإكسل الأصلى، وتُحمَّل ببياناته كنقطة بداية ويمكن التعديل عليها أو إضافة صفوف جديدة بحرية من هنا.
    </div>
    <div style="overflow-x:auto">
    <table class="tbl">
      <thead><tr>${headHtml}</tr></thead>
      <tbody>${bodyHtml}</tbody>
      <tfoot><tr>${totalsRow}</tr></tfoot>
    </table>
    </div>
  </div>`;
}

function updateTreasuryCell(idx, key, value){
  if(!TREASURY_ROWS[idx]) return;
  const col = TREASURY_COLS.find(c=>c.key===key);
  TREASURY_ROWS[idx][key] = (col && col.type==='num') ? (parseFloat(value)||0) : value;
  storageSet(TREASURY_KEY, JSON.stringify(TREASURY_ROWS));
  renderSheet(); // لإعادة حساب الإجمالى الخاص بالصف وصف الإجماليات أسفل الجدول
}
function addTreasuryRow(){
  const blank = {};
  TREASURY_COLS.forEach(c=> blank[c.key] = c.type==='num' ? 0 : '');
  TREASURY_ROWS.push(blank);
  storageSet(TREASURY_KEY, JSON.stringify(TREASURY_ROWS));
  renderSheet();
}
function deleteTreasuryRow(idx){
  if(!confirm('حذف هذا الصف نهائيًا؟')) return;
  TREASURY_ROWS.splice(idx,1);
  storageSet(TREASURY_KEY, JSON.stringify(TREASURY_ROWS));
  renderSheet();
}
function exportTreasuryToExcel(){
  if(!TREASURY_ROWS.length){ alert('لا توجد بيانات لتصديرها.'); return; }
  const header = TREASURY_COLS.map(c=>c.label).concat('الإجمالى');
  const aoa = [header];
  TREASURY_ROWS.forEach(r=>{
    aoa.push(TREASURY_COLS.map(c=> r[c.key]!==undefined?r[c.key]:'').concat(treasuryRowTotal(r)));
  });
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'إيرادات الخزنة');
  XLSX.writeFile(wb, 'إيرادات الخزنة.xlsx');
}

/* تجميع السجلين (الصباحى والمسائى) إلى أعمدة توريد/إيصالات لكل بند، ومزامنتها تلقائيًا مع شيت توريد وإيصالات
   (لا تُعدَّل إلا البنود التى لها قيود مُدخلة بالفعل، حفاظًا على أى قيم أخرى أُدخلت يدويًا) */
function syncSupplyFromReceipts(){
  const m = getCurrentMonth(); if(!m || m.locked) return;
  const newSupply = m.supply.map(r=>[r[0], r[1], r[2], r[3], r[4]]);
  SERVICE_NAMES.forEach((name,idx)=>{
    const morningCount = m.receiptLogMorning.filter(r=>(Number(r.svc[idx])||0)>0).length;
    const eveningCount = m.receiptLogEvening.filter(r=>(Number(r.svc[idx])||0)>0).length;
    if(morningCount===0 && eveningCount===0) return; // لا يوجد قيد بعد لهذا البند، اترك القيمة كما هى
    const morningAmt = m.receiptLogMorning.reduce((s,r)=> s + (Number(r.svc[idx])||0), 0);
    const eveningAmt = m.receiptLogEvening.reduce((s,r)=> s + (Number(r.svc[idx])||0), 0);
    const rowIdx = newSupply.findIndex(r=>r[0]===name);
    if(rowIdx>-1){ newSupply[rowIdx] = [name, morningAmt, eveningAmt, morningCount, eveningCount]; }
    else { newSupply.push([name, morningAmt, eveningAmt, morningCount, eveningCount]); }
  });
  m.supply = newSupply;
  if(currentSheet==='supply') renderSheet();
}

/* --- شيت منصرف الدفاتر --- */
function renderDaftarSheet(m){
  const rows = m.daftar;
  const rowsHtml = rows.map((r,i)=>{
    const total = (Number(r[1])||0)*(Number(r[2])||0);
    return `<tr>
      <td>${cell(m,'daftar',i,0,r[0],'text')}</td>
      <td>${cell(m,'daftar',i,1,r[1],'num')}</td>
      <td>${cell(m,'daftar',i,2,r[2],'num')}</td>
      <td class="num" style="font-weight:800" id="daf-t-${i}">${fmt(total)}</td>
      <td class="no-print">${m.locked?'':`<button class="btn-er" onclick="removeRow('daftar',${i})">✕</button>`}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="5" style="color:var(--tm);font-weight:600">لا توجد بيانات بعد${m.locked?'':' — اضغط "➕ إضافة دفتر"'}</td></tr>`;

  const grand = rows.reduce((s,r)=> s + (Number(r[1])||0)*(Number(r[2])||0), 0);
  const btns = m.locked ? '' : `<div class="head-btns no-print">
      <button class="btn btn-o btn-sm" onclick="triggerImport('daftar')">📥 استيراد إكسل</button>
      <button class="btn btn-p btn-sm" onclick="addRow('daftar')">➕ إضافة دفتر</button>
    </div>`;

  return `
  <div class="sheet-card">
    <div class="sheet-card-head">
      <h2>منصرف الدفاتر</h2>
      ${btns}
    </div>
    <table class="tbl">
      <thead><tr><th>اسم الدفتر</th><th>العدد</th><th>سعر الدفتر</th><th>إجمالى السعر</th><th class="no-print" style="width:40px"></th></tr></thead>
      <tbody id="daftar-body">${rowsHtml}</tbody>
      <tfoot><tr><td colspan="3">الإجمالى الكلى</td><td class="num" id="daf-grand">${fmt(grand)}</td><td class="no-print"></td></tr></tfoot>
    </table>
  </div>`;
}
function recalcDaftar(){
  const m = getCurrentMonth(); if(!m) return;
  const rows = m.daftar;
  rows.forEach((r,i)=>{
    setText('daf-t-'+i, fmt((Number(r[1])||0)*(Number(r[2])||0)));
  });
  const grand = rows.reduce((s,r)=> s + (Number(r[1])||0)*(Number(r[2])||0), 0);
  setText('daf-grand', fmt(grand));
}

/* --- شيت توزيع الأشخاص --- */
function renderPeopleSheet(m){

  const rowsHtml = rows.map((r,i)=>{
    const total = (Number(r[1])||0)+(Number(r[2])||0)+(Number(r[3])||0)+(Number(r[4])||0)+(Number(r[5])||0);

      <td>${cell(m,'people',i,0,r[0],'text')}</td>
      <td>${cell(m,'people',i,1,r[1],'num')}</td>
      <td>${cell(m,'people',i,2,r[2],'num')}</td>
      <td>${cell(m,'people',i,3,r[3],'num')}</td>
      <td>${cell(m,'people',i,4,r[4],'num')}</td>
      <td>${cell(m,'people',i,5,r[5],'num')}</td>
      <td class="num" style="font-weight:900;color:var(--p)" id="ppl-t-${i}">${fmt(total)}</td>
      <td class="no-print">${m.locked?'':`<button class="btn-er" onclick="removeRow('people',${i})">✕</button>`}</td>

  }).join('') || `<tr><td colspan="8" style="color:var(--tm);font-weight:600">لا توجد بيانات بعد${m.locked?'':' — اضغط "➕ إضافة شخص"'}</td></tr>`;

  const totals = [1,2,3,4,5].map(c=>sumCol(rows,c));
  const grand = totals.reduce((a,b)=>a+b,0);
  const btns = m.locked ? '' : `<div class="head-btns no-print">

      <button class="btn btn-p btn-sm" onclick="addRow('people')">➕ إضافة شخص</button>

  return `

    <div class="sheet-card-head">
      <h2>توزيع مستحقات صندوق تحسين الخدمة على الأشخاص</h2>
      ${btns}
    </div>
    <div style="overflow-x:auto">
    <table class="tbl">
      <thead><tr>
        <th style="min-width:150px">اسم الشخص</th>
        <th>عيادة خارجية صباحى</th><th>عيادة خارجية مسائى</th><th>صندوق</th><th>تأمين</th><th>نفقة</th>
        <th style="width:120px">الإجمالى</th><th class="no-print" style="width:40px"></th>
      </tr></thead>
      <tbody id="people-body">${rowsHtml}</tbody>
      <tfoot>
        <tr>
          <td>الإجمالى الكلى</td>

          <td class="num" id="pt-4">${fmt(totals[3])}</td>
          <td class="num" id="pt-5">${fmt(totals[4])}</td>
          <td class="num" id="pt-grand">${fmt(grand)}</td>
          <td class="no-print"></td>
        </tr>
      </tfoot>
    </table>
    </div>
  </div>
  <div class="sheet-card">
    <div class="sign-row no-print">
      <div class="sign-item">أمين الصندوق<span>...............</span></div>
      <div class="sign-item">المدير المالى<span>...............</span></div>
      <div class="sign-item">المدير المالى والإدارى<span>...............</span></div>
      <div class="sign-item">يعتمد<span>...............</span></div>
    </div>
  </div>`;
}
function recalcPeople(){
  const m = getCurrentMonth(); if(!m) return;
  const rows = m.people;
  rows.forEach((r,i)=>{
    const total = (Number(r[1])||0)+(Number(r[2])||0)+(Number(r[3])||0)+(Number(r[4])||0)+(Number(r[5])||0);
    setText('ppl-t-'+i, fmt(total));
  });
  const totals = [1,2,3,4,5].map(c=>sumCol(rows,c));
  totals.forEach((v,i)=> setText('pt-'+(i+1), fmt(v)));
  setText('pt-grand', fmt(totals.reduce((a,b)=>a+b,0)));
}

// منع تغيير قيمة أى حقل رقم عن طريق عجلة الماوس أثناء التركيز عليه
document.addEventListener('wheel', function(e){
  if(document.activeElement && document.activeElement.tagName==='INPUT' && document.activeElement.type==='number'){
    document.activeElement.blur();
  }
}, {passive:true});

// منع أسهم الزيادة/النقصان (الأعلى/الأسفل) من تغيير قيمة حقول الأرقام
document.addEventListener('keydown', function(e){
  if((e.key==='ArrowUp' || e.key==='ArrowDown') && e.target && e.target.tagName==='INPUT' && e.target.type==='number'){
    e.preventDefault();
  }
});

init();
</script>
